<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seu desconto Macal</title>
<style>
  :root {
    --verde: #009246;
    --vermelho: #ed3237;
    --escuro: #18382b;
    --fundo: rgb(238,242,239);
    --card: #ffffff;
    --texto-muted: #5d675f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--fundo);
    font-family: Arial, Helvetica, sans-serif;
    color: var(--escuro);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    background: var(--card);
    width: 100%;
    max-width: 420px;
    border-radius: 16px;
    padding: 40px 32px;
    text-align: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(24,56,43,0.08);
  }

  .logo {
    height: 34px;
    margin-bottom: 28px;
  }

  .barra {
    width: 56px;
    height: 3px;
    background: var(--verde);
    margin: 0 auto 28px;
    border-radius: 2px;
  }

  /* ---------- ESTADOS ---------- */
  .estado { display: none; }
  .estado.ativo { display: block; }

  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 22px;
    line-height: 1.35;
    margin-bottom: 14px;
  }

  .sub {
    font-size: 14px;
    color: var(--texto-muted);
    line-height: 1.6;
    margin-bottom: 32px;
  }

  button {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: bold;
    color: #fff;
    background: var(--verde);
    border: none;
    border-radius: 6px;
    padding: 15px 28px;
    width: 100%;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  button:active { transform: scale(0.97); }
  button:hover { background: #007a3a; }

  /* ---------- EXPLOSÃO ---------- */
  .palco {
    position: relative;
    height: 170px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 0;
  }

  .onda {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 18px;
    height: 18px;
    border: 2px solid var(--escuro);
    border-radius: 50%;
    opacity: 0;
    transform: translate(-50%, -50%) scale(1);
  }

  .explodindo .onda {
    animation: onda-choque 0.7s cubic-bezier(.2,.7,.3,1) forwards;
  }

  @keyframes onda-choque {
    0%   { opacity: 0.55; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(8.5); }
  }

  .particula {
    position: absolute;
    top: 50%;
    left: 50%;
    opacity: 0;
    background: var(--verde);
  }

  .particula.redonda { border-radius: 50%; }
  .particula.reta { border-radius: 1px; }

  .explodindo .particula {
    animation: estourar 1.1s cubic-bezier(.16,.72,.25,1) forwards;
    animation-delay: var(--atraso, 0s);
  }

  @keyframes estourar {
    0%   { opacity: 1; transform: translate(-50%,-50%) translate(0,0) scale(1) rotate(0deg); }
    60%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%,-50%) translate(var(--tx), var(--ty)) scale(0.5) rotate(var(--rot)); }
  }

  .medalha {
    width: 116px;
    height: 116px;
    border-radius: 50%;
    border: 1px solid var(--verde);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    opacity: 0;
    transform: scale(0.55);
    transition: opacity 0.35s ease, transform 0.55s cubic-bezier(.32,1.5,.62,1);
  }

  .medalha.visivel { opacity: 1; transform: scale(1); }

  .medalha-interna {
    width: 98px;
    height: 98px;
    border-radius: 50%;
    border: 1px solid var(--escuro);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .numero {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 38px;
    color: var(--escuro);
    line-height: 1;
  }

  .numero span { font-size: 21px; }

  .legenda-desconto {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--texto-muted);
    margin: 18px 0 28px;
    opacity: 0;
    transition: opacity 0.4s ease 0.15s;
  }

  .legenda-desconto.visivel { opacity: 1; }

  /* ---------- VENDEDORES ---------- */
  .vendedores {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 8px;
  }

  .vendedor {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .vendedor:hover { transform: none; background: none; }

  .avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: Georgia, serif;
    font-size: 20px;
    border: 3px solid transparent;
    transition: border-color 0.15s ease;
    overflow: hidden;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .vendedor:hover .avatar { border-color: var(--verde); }

  .nome-vendedor {
    font-size: 12.5px;
    color: var(--escuro);
    font-weight: bold;
  }

  @media (prefers-reduced-motion: reduce) {
    .particula, .onda { display: none; }
    .medalha, .legenda-desconto { transition: none; }
  }
</style>
</head>
<body>

<div class="card">

  <img class="logo" src="https://stratus.campaign-image.com/images/864203000072099196_zc_v1_1786713172143_logo_01_macala.png" alt="Macal Madeiras">
  <div class="barra"></div>

  <!-- ESTADO 1: convite -->
  <div class="estado ativo" id="estado-inicio">
    <h1>Você tem um desconto reservado</h1>
    <p class="sub">Toque no botão abaixo pra descobrir a condição especial que separamos pra você.</p>
    <button id="btn-revelar">Descobrir meu desconto</button>
  </div>

  <!-- ESTADO 2: revelação -->
  <div class="estado" id="estado-revelacao">
    <div class="palco" id="palco"></div>
    <div class="medalha" id="medalha">
      <div class="medalha-interna">
        <div class="numero" id="numero">-- <span>%</span></div>
      </div>
    </div>
    <p class="legenda-desconto" id="legenda">de desconto na sua próxima compra</p>
    <button id="btn-resgatar" style="display:none;">Resgatar com um consultor</button>
  </div>

  <!-- ESTADO 3: escolha do vendedor -->
  <div class="estado" id="estado-vendedores">
    <h1>Fale com quem vai cuidar do seu pedido</h1>
    <p class="sub">Escolha um consultor pra confirmar seu desconto no WhatsApp.</p>
    <div class="vendedores" id="lista-vendedores"></div>
  </div>

</div>

<script>
  /* ======================================================
     CONFIGURAÇÃO — troque aqui antes de subir pra produção
     ====================================================== */

  // O valor real deve vir mesclado no link do email (campo do Zoho),
  // nunca sorteado no navegador. Isso mantém o número auditável e
  // dentro do que foi aprovado pelo Felipe/Marcelo.
  // Exemplo de link real: pagina.html?desconto=12
  const params = new URLSearchParams(window.location.search);
  const DESCONTO_FALLBACK = 10; // só usado se ?desconto= não vier na URL (demo)
  const desconto = parseInt(params.get('desconto')) || DESCONTO_FALLBACK;

  // Troque nome, iniciais, cor e telefone (formato 55DDNUMERO) de cada vendedor.
  // Se cada vendedor tiver WhatsApp próprio, troca o "telefone" individualmente.
  // Se todos caem no mesmo número (Macal Marketing) e a triagem é manual,
  // deixa o mesmo telefone nos três e o nome ajuda a rotear internamente.
  const VENDEDORES = [
    { nome: "Marcelo",    iniciais: "MA", cor: "#009246", telefone: "5531994380416", foto: "marcelo.jpg" },
    { nome: "Felipe",     iniciais: "FE", cor: "#18382b", telefone: "5531994380407", foto: "felipe.jpg" },
    { nome: "Ana Livia",  iniciais: "AL", cor: "#ed3237", telefone: "5531994340777", foto: "ana-livia.jpg" },
    { nome: "Kaique",     iniciais: "KA", cor: "#009246", telefone: "5531984335866", foto: "kaique.jpg" },
    { nome: "Ricardo",    iniciais: "RI", cor: "#18382b", telefone: "5531982094862", foto: "ricardo.jpg" },
    { nome: "Bruno",      iniciais: "BR", cor: "#ed3237", telefone: "5531983415122", foto: "bruno.jpg" },
    { nome: "Matheus",    iniciais: "MT", cor: "#009246", telefone: "5531983494210", foto: "matheus.jpg" },
    { nome: "Thaís",      iniciais: "TH", cor: "#18382b", telefone: "5531985428504", foto: "thais.jpg" },
    { nome: "Douglas",    iniciais: "DO", cor: "#ed3237", telefone: "5531982369477", foto: "douglas.jpg" },
  ];

  /* ====================================================== */

  const estadoInicio = document.getElementById('estado-inicio');
  const estadoRevelacao = document.getElementById('estado-revelacao');
  const estadoVendedores = document.getElementById('estado-vendedores');
  const palco = document.getElementById('palco');
  const medalhaEl = document.getElementById('medalha');
  const numeroEl = document.getElementById('numero');
  const legendaEl = document.getElementById('legenda');
  const btnResgatar = document.getElementById('btn-resgatar');

  function trocarEstado(sair, entrar) {
    sair.classList.remove('ativo');
    entrar.classList.add('ativo');
  }

  function criarParticulas() {
    const cores = ['#009246', '#ed3237', '#18382b'];
    palco.innerHTML = '';

    const onda = document.createElement('div');
    onda.className = 'onda';
    palco.appendChild(onda);

    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      const formato = i % 3;
      p.className = 'particula' + (formato === 0 ? ' redonda' : formato === 2 ? ' reta' : '');

      const base = 6 + Math.random() * 7;
      if (formato === 2) {
        p.style.width = (base * 0.35) + 'px';
        p.style.height = (base * 1.7) + 'px';
      } else {
        p.style.width = base + 'px';
        p.style.height = base + 'px';
      }

      const angulo = (Math.PI * 2 * i) / 30 + (Math.random() * 0.3 - 0.15);
      const distancia = 85 + Math.random() * 55;
      const queda = 20 + Math.random() * 30; // leve efeito de gravidade após o estouro
      p.style.setProperty('--tx', Math.cos(angulo) * distancia + 'px');
      p.style.setProperty('--ty', (Math.sin(angulo) * distancia + queda) + 'px');
      p.style.setProperty('--rot', (Math.random() * 540 - 270) + 'deg');
      p.style.setProperty('--atraso', (Math.random() * 0.1) + 's');
      p.style.background = cores[i % cores.length];
      palco.appendChild(p);
    }
    palco.classList.add('explodindo');
  }

  function contarAte(alvo) {
    const duracao = 700;
    const inicio = performance.now();
    function passo(agora) {
      const t = Math.min((agora - inicio) / duracao, 1);
      const valor = Math.round(t * alvo);
      numeroEl.innerHTML = valor + ' <span>%</span>';
      if (t < 1) requestAnimationFrame(passo);
    }
    requestAnimationFrame(passo);
  }

  document.getElementById('btn-revelar').addEventListener('click', () => {
    trocarEstado(estadoInicio, estadoRevelacao);
    criarParticulas();
    setTimeout(() => {
      medalhaEl.classList.add('visivel');
      legendaEl.classList.add('visivel');
      contarAte(desconto);
      btnResgatar.style.display = 'block';
    }, 600);
  });

  btnResgatar.addEventListener('click', () => {
    trocarEstado(estadoRevelacao, estadoVendedores);
  });

  const lista = document.getElementById('lista-vendedores');
  VENDEDORES.forEach(v => {
    const btn = document.createElement('button');
    btn.className = 'vendedor';
    btn.innerHTML = `
      <div class="avatar" style="background:${v.cor}">
        <img src="${v.foto}" alt="${v.nome}" onerror="this.remove(); this.parentElement.textContent='${v.iniciais}';">
      </div>
      <div class="nome-vendedor">${v.nome}</div>
    `;
    btn.addEventListener('click', () => {
      const texto = encodeURIComponent(
        `Olá ${v.nome}, quero saber sobre meu desconto de ${desconto}%.`
      );
      window.open(`https://wa.me/${v.telefone}?text=${texto}`, '_blank');
    });
    lista.appendChild(btn);
  });
</script>

</body>
</html>
